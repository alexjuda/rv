[project]
name = "rv"
description = "CLI code review tool"
dynamic= ["version"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "rich>=15.0.0",
    "peewee>=4.1.0",
    "typer>=0.26.8",
    "humanize>=4.15.0",
]

[project.scripts]
rv = "rv.cli.main:app"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.15.18",
    "ty>=0.0.35",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"
