[project]
name = "rv"
version = "0.1.0"
description = "CLI code review tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygls>=1.3.0,<2",
    "httpx>=0.27.0,<1",
    "keyring>=25.0.0,<26",
    "watchfiles>=1.0.0,<2",
    "click>=8.1.0,<9",
    "tabulate>=0.10.0",
]

[project.scripts]
rv = "rv.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-recording>=0.13.4",
    "ty>=0.0.35",
]
